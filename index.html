<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chargement...</title>
<style>
/* ===== Couleur d'accent : change-la ici (ou dans CONFIG.accent plus bas) ===== */
:root { --accent: #3508b3; --bg: #0b0b10; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #ececf4;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; user-select: none; cursor: default;
}

/* ---------- Fond : diaporama avec léger zoom ---------- */
.slide {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover; background-position: center; opacity: 0;
    transition: opacity 1.6s ease; animation: kb 18s ease-out forwards;
}
@keyframes kb { from { transform: scale(1); } to { transform: scale(1.12); } }

#fallback {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 20%, #2a1f45 0%, #0b0b10 70%);
}
#shade {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
        linear-gradient(to right, rgba(6,6,10,.82) 0%, rgba(6,6,10,.35) 55%, rgba(6,6,10,.7) 100%),
        linear-gradient(to top, rgba(6,6,10,.95) 0%, rgba(6,6,10,0) 40%);
}

/* ---------- En-tête : logo + nom du serveur ---------- */
#brand { position: absolute; left: 5vw; top: 7vh; max-width: 55vw; }
#logo { display: none; height: 14vh; max-width: 30vw; margin-bottom: 2vh; }
#serverName { font-size: 6.4vh; font-weight: 900; letter-spacing: .5vh; line-height: 1.05; text-shadow: 0 .4vh 2vh rgba(0,0,0,.8); }
#serverName span { color: var(--accent); }
#tagline { margin-top: 1.2vh; font-size: 2.4vh; color: #b9b9c8; letter-spacing: .3vh; }
#bar-accent { width: 9vh; height: .6vh; margin-top: 2.4vh; background: var(--accent); border-radius: 1vh; }

/* ---------- Statut ---------- */
#status-box { position: absolute; left: 5vw; bottom: 14vh; width: 55vw; }
#status { font-size: 3vh; font-weight: 700; }
#file { margin-top: .8vh; font-size: 1.9vh; color: #9a9aae; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#meta { margin-top: 1.4vh; font-size: 1.9vh; color: #b9b9c8; }
#meta b { color: var(--accent); }

/* ---------- Carte latérale : astuces + infos ---------- */
#side { position: absolute; right: 4vw; top: 8vh; width: 28vw; min-width: 300px; }
.card {
    background: rgba(14,14,22,.78); border: 1px solid rgba(255,255,255,.08);
    border-left: .5vh solid var(--accent); border-radius: 1.2vh; padding: 2.4vh 2.2vw; margin-bottom: 2.4vh;
}
.card h3 { font-size: 1.7vh; letter-spacing: .35vh; color: var(--accent); margin-bottom: 1.4vh; }
#tip { font-size: 2.2vh; line-height: 1.5; min-height: 9vh; transition: opacity .6s ease; }
#rules li { font-size: 1.9vh; line-height: 1.7; margin-left: 2vh; color: #d6d6e2; }
#discord { font-size: 2.1vh; color: #d6d6e2; }
#discord b { color: var(--accent); }

/* ---------- Barre de progression ---------- */
#progress { position: absolute; left: 0; right: 0; bottom: 0; height: 9vh; background: rgba(6,6,10,.9); }
#track { position: absolute; left: 5vw; right: 5vw; top: 3.4vh; height: 1.1vh; background: rgba(255,255,255,.1); border-radius: 1vh; overflow: hidden; }
#bar { width: 0%; height: 100%; background: linear-gradient(90deg, #8a6d14, var(--accent), #f3dc82); border-radius: 1vh; box-shadow: 0 0 2vh var(--accent); }
#pct { position: absolute; right: 5vw; top: .3vh; font-size: 1.8vh; font-weight: 700; color: var(--accent); }
#progress-label { position: absolute; left: 5vw; top: .3vh; font-size: 1.8vh; color: #9a9aae; letter-spacing: .3vh; }

/* ---------- Lecteur de musique ---------- */
#music {
    position: absolute; right: 4vw; bottom: 11vh; width: 28vw; min-width: 300px; display: none;
    background: rgba(14,14,22,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 1.2vh; padding: 1.6vh 1.4vw;
}
#music .row { display: flex; align-items: center; }
#playBtn {
    width: 4.6vh; height: 4.6vh; min-width: 34px; min-height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #1a1405; font-size: 2vh; font-weight: 900; margin-right: 1.2vw;
}
#trackTitle { flex: 1; font-size: 1.9vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#vol { width: 7vw; min-width: 80px; margin-left: 1vw; accent-color: var(--accent); cursor: pointer; }
#musicHint { margin-top: .8vh; font-size: 1.5vh; color: #8a8aa0; }
</style>
</head>
<body>

<div id="fallback"></div>
<div class="slide" id="slideA"></div>
<div class="slide" id="slideB"></div>
<div id="shade"></div>

<div id="brand">
    <img id="logo" alt="">
    <div id="serverName"></div>
    <div id="tagline"></div>
    <div id="bar-accent"></div>
</div>

<div id="status-box">
    <div id="status">Connexion au serveur...</div>
    <div id="file"></div>
    <div id="meta"></div>
</div>

<div id="side">
    <div class="card"><h3>LE SAVAIS-TU ?</h3><div id="tip"></div></div>
    <div class="card" id="rulesCard"><h3>RÈGLES RAPIDES</h3><ul id="rules"></ul></div>
    <div class="card" id="discordCard"><h3>COMMUNAUTÉ</h3><div id="discord"></div></div>
</div>

<div id="music">
    <div class="row">
        <button id="playBtn">&#9654;</button>
        <div id="trackTitle"></div>
        <input id="vol" type="range" min="0" max="100" value="35">
    </div>
    <div id="musicHint"></div>
</div>

<div id="progress">
    <div id="progress-label">CHARGEMENT</div>
    <div id="pct">0%</div>
    <div id="track"><div id="bar"></div></div>
</div>

<script>
/* =====================================================================
   CONFIGURATION : tout se règle ici
   ===================================================================== */
var CONFIG = {
    serverName: "Myra | Anomaly RP",          // affiché en grand (mets le dernier mot en couleur avec accentWord)
    accentWord: "",                        // ex : "RP" -> le mot "RP" sera coloré. Laisse vide pour ne rien colorer.
    tagline:    "Faites toujours attention aux coins sombres...",
    accent:     "#d4af37",                 // couleur principale (or)

    logo:   "img/logo.png",                // facultatif : s'il n'existe pas, il n'est simplement pas affiché

    // Images du diaporama (mets les tiennes dans le dossier img/). Format conseillé : JPG 1920x1080, moins de 500 Ko.
    images: [
        "img/bg1.jpg",
        "img/bg2.jpg",
        "img/bg3.jpg",
        "img/bg4.jpg"
    ],
    slideSeconds: 8,                       // durée d'affichage de chaque image

    // Musique (mp3 ou ogg dans le dossier music/). Laisse la liste vide pour ne pas avoir de lecteur.
    music: [
    { title: "JIN", file: "music/JIN — Aurora Belladonna.mp3" }    // { title: "Nom du morceau", file: "music/morceau1.mp3" },
    ],
    musicVolume: 0.35,                     // volume de départ (0 à 1) ; le joueur peut le changer
    musicShuffle: true,                    // commence sur un morceau au hasard

    tips: [
        "Tape !bari en jeu pour voir toutes les commandes du serveur.",
        "Les élections du Maire ont lieu toutes les semaines : présente-toi et vote !",
        "La Division Spéciale est la seule force capable d'affronter réellement les entités.",
        "Appuie sur F4 pour choisir ton job, acheter des objets et lancer des actions rapides.",
        "Un grade de police ou de médecin se débloque avec du temps de jeu ou une whitelist."
    ],
    tipSeconds: 7,

    rules: [
        "Respecte les autres joueurs",
        "Joue comme si tu es ton personnage",
        "Reste dans ton rôle (RP)"
    ],

    discord: "discord.gg/Bz8MuwakCG"          // laisse vide pour masquer le bloc
};

/* =====================================================================
   Code (tu n'as normalement rien à modifier en dessous)
   ===================================================================== */
function $(id) { return document.getElementById(id); }

(function init() {
    document.documentElement.style.setProperty("--accent", CONFIG.accent);

    // Nom du serveur (avec un mot coloré facultatif)
    var name = CONFIG.serverName;
    if (CONFIG.accentWord && name.indexOf(CONFIG.accentWord) !== -1) {
        name = name.replace(CONFIG.accentWord, "<span>" + CONFIG.accentWord + "</span>");
    }
    $("serverName").innerHTML = name;
    $("tagline").textContent = CONFIG.tagline;

    // Logo : affiché seulement s'il se charge
    var logo = $("logo");
    logo.onload = function () { logo.style.display = "block"; };
    logo.src = CONFIG.logo;

    // Règles et Discord
    var rules = $("rules");
    if (CONFIG.rules && CONFIG.rules.length) {
        CONFIG.rules.forEach(function (r) { var li = document.createElement("li"); li.textContent = r; rules.appendChild(li); });
    } else { $("rulesCard").style.display = "none"; }

    if (CONFIG.discord) { $("discord").innerHTML = "Rejoins-nous : <b>" + CONFIG.discord + "</b>"; }
    else { $("discordCard").style.display = "none"; }
})();

/* ---------- Diaporama : ne garde que les images qui existent vraiment ---------- */
(function slideshow() {
    var front = $("slideA"), back = $("slideB"), valid = [], cur = 0;

    function show(url) {
        back.style.backgroundImage = 'url("' + url + '")';
        back.style.animation = "none"; void back.offsetWidth; back.style.animation = ""; // relance le zoom
        back.style.opacity = 1;
        front.style.opacity = 0;
        var t = front; front = back; back = t;
        $("fallback").style.display = "none";
    }

    CONFIG.images.forEach(function (u) {
        var im = new Image();
        im.onload = function () { valid.push(u); if (valid.length === 1) show(u); };
        im.src = u;
    });

    setInterval(function () {
        if (valid.length > 1) { cur = (cur + 1) % valid.length; show(valid[cur]); }
    }, CONFIG.slideSeconds * 1000);
})();

/* ---------- Astuces qui tournent ---------- */
(function tips() {
    var el = $("tip"), i = Math.floor(Math.random() * CONFIG.tips.length);
    function next() {
        el.style.opacity = 0;
        setTimeout(function () {
            el.textContent = CONFIG.tips[i % CONFIG.tips.length];
            el.style.opacity = 1;
            i++;
        }, 600);
    }
    next();
    setInterval(next, CONFIG.tipSeconds * 1000);
})();

/* ---------- Progression (alimentée par GMod) ---------- */
var filesTotal = 0, filesNeeded = 0, target = 0, shown = 0;

function refreshProgress() {
    if (filesTotal > 0) target = Math.max(0, Math.min(1, (filesTotal - filesNeeded) / filesTotal));
}

(function animateBar() {
    shown += (target - shown) * 0.08;
    if (Math.abs(target - shown) < 0.0005) shown = target;
    $("bar").style.width = (shown * 100) + "%";
    $("pct").textContent = filesTotal > 0 ? Math.round(shown * 100) + "%" : "...";
    requestAnimationFrame(animateBar);
})();

/* Traduction des statuts anglais de GMod les plus courants (le reste s'affiche tel quel) */
function translateStatus(s) {
    var l = (s || "").toLowerCase();
    if (l.indexOf("workshop") !== -1) return "Téléchargement du contenu Workshop...";
    if (l.indexOf("sending client info") !== -1) return "Envoi de tes informations...";
    if (l.indexOf("retrieving server info") !== -1) return "Récupération des infos du serveur...";
    if (l.indexOf("mounting") !== -1) return "Montage des contenus...";
    if (l.indexOf("lua") !== -1) return "Chargement des scripts...";
    if (l.indexOf("download") !== -1) return "Téléchargement des fichiers...";
    if (l.indexOf("precach") !== -1) return "Préparation des ressources...";
    if (l.indexOf("sending") !== -1 || l.indexOf("connect") !== -1) return "Connexion en cours...";
    return s;
}

/* Fonctions appelées automatiquement par GMod pendant le chargement */
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    var parts = [];
    if (mapname) parts.push("Map : <b>" + mapname + "</b>");
    if (maxplayers) parts.push("<b>" + maxplayers + "</b> joueurs max");
    $("meta").innerHTML = parts.join("  &nbsp;|&nbsp;  ");
}
function SetFilesTotal(total)   { filesTotal = total;   refreshProgress(); }
function SetFilesNeeded(needed) { filesNeeded = needed; refreshProgress(); }
function SetStatusChanged(status) { $("status").textContent = translateStatus(status); }
function DownloadingFile(fileName) { $("file").textContent = fileName; }

/* ---------- Lecteur de musique ---------- */
(function music() {
    var tracks = CONFIG.music || [];
    if (!tracks.length) return;

    $("music").style.display = "block";

    var audio = new Audio();
    var ti = CONFIG.musicShuffle ? Math.floor(Math.random() * tracks.length) : 0;
    var vol = CONFIG.musicVolume;

    // Volume mémorisé d'une connexion à l'autre (si le navigateur le permet)
    try { var saved = localStorage.getItem("dsc_loading_vol"); if (saved !== null) vol = parseFloat(saved); } catch (e) {}
    audio.volume = vol;
    $("vol").value = Math.round(vol * 100);

    function load(i) {
        ti = i % tracks.length;
        audio.src = tracks[ti].file;
        $("trackTitle").textContent = tracks[ti].title;
    }
    function ui(playing) {
        $("playBtn").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
        $("musicHint").textContent = playing ? "" : "Clique sur le bouton pour lancer la musique";
    }
    function play() {
        var p = audio.play();
        if (p && p.then) p.then(function () { ui(true); }, function () { ui(false); });
    }

    audio.addEventListener("ended", function () { load(ti + 1); play(); });
    $("playBtn").onclick = function () { if (audio.paused) play(); else { audio.pause(); ui(false); } };
    $("vol").oninput = function () {
        audio.volume = this.value / 100;
        try { localStorage.setItem("dsc_loading_vol", String(audio.volume)); } catch (e) {}
    };

    load(ti);
    play();
})();

/* ---------- Mode démo : ouvre la page dans ton navigateur avec #demo à la fin de l'adresse ---------- */
if (location.hash === "#demo") {
    GameDetails("Demo", "", "rp_exemple_map", 64, "", "darkrp");
    SetFilesTotal(200);
    SetFilesNeeded(200);
    SetStatusChanged("Downloading files...");
    var n = 200;
    var demo = setInterval(function () {
        n -= 2;
        SetFilesNeeded(Math.max(0, n));
        DownloadingFile("materials/dsc/f4/banner.png");
        if (n <= 0) { clearInterval(demo); SetStatusChanged("Lua Loaded"); }
    }, 150);
}
</script>
</body>
</html>
